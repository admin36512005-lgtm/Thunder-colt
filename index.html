<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الاشتراكات الرقمية</title>
    <!-- Tailwind CSS للتصميم السريع والفخم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase للربط بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- شريط التنقل العلوي -->
    <header class="bg-gray-800 border-b border-gray-700 py-4 px-6 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-emerald-400">⚡ متجر الاشتراكات</h1>
            <span class="text-sm bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">متجر رسمي وآمن</span>
        </div>
    </header>

    <!-- الهيدر الترحيبي -->
    <section class="py-12 px-6 text-center bg-gradient-to-b from-gray-800 to-gray-900">
        <h2 class="text-4xl font-extrabold mb-4">THUNDER COLT </h2>
        <p class="text-gray-400 max-w-xl mx-auto">احصل على اشتراكاتك المفضلة فوراً وبضمان كامل وبأسعار منافسة جداً.</p>
    </section>

    <!-- قسم المنتجات -->
    <main class="container mx-auto px-6 py-10">
        <h3 class="text-2xl font-bold mb-6 border-r-4 border-emerald-500 pr-3">الاشتراكات المتاحة</h3>
        
        <!-- هنا سيتم عرض المنتجات تلقائياً من قاعدة البيانات -->
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="text-center col-span-full py-10 text-gray-500">جاري تحميل المنتجات...</div>
        </div>
    </main>

    <!-- سكربت الاتصال بـ Supabase وجلب المنتجات -->
    <script>
        // ضع معلومات مشروعك هنا:
        const SUPABASE_URL = 'https://ucexqqdowabodjckufe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HowQ_BII_xJbVKFiwe08w_13kSV...'; // مفتاحك الكامل

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchProducts() {
            const grid = document.getElementById('products-grid');
            
            const { data, error } = await _supabase.from('products').select('*');

            if (error) {
                console.error('خطأ في جلب البيانات:', error);
                grid.innerHTML = `<p class="text-red-400 col-span-full text-center">حدث خطأ أثناء تحميل المنتجات.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 col-span-full text-center">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }

            grid.innerHTML = '';
            data.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-lg flex flex-col justify-between hover:border-emerald-500 transition-all duration-300">
                        <div>
                            <h4 class="text-xl font-bold text-white mb-2">${product.name}</h4>
                            <p class="text-gray-400 text-sm mb-4">${product.description || 'اشتراك رسمي وبضمان كامل طوال مدة الاستخدام.'}</p>
                        </div>
                        <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-700">
                            <span class="text-xl font-black text-emerald-400">${product.price} ر.س</span>
                            <button onclick="buyProduct('${product.name}', ${product.price})" class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold px-4 py-2 rounded-xl transition">اشتري الآن</button>
                        </div>
                    </div>
                `;
            });
        }

        function buyProduct(name, price) {
            alert(`شكراً لاختيارك: ${name}\nالسعر: ${price} ر.س\n(قريباً سنقوم بربط بوابة الدفع والتسليم الآلي هنا!)`);
        }

        // تشغيل الدالة عند فتح الصفحة
        fetchProducts();
    </script>
</body>
</html>

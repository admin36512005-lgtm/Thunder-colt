<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THUNDER COLT | المتجر الرقمي الفاخر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        .neon-glow {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15);
        }
        .neon-glow:hover {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.35);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .hero-gradient {
            background: radial-gradient(circle at center, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <div class="fixed inset-0 hero-gradient pointer-events-none z-0"></div>

    <header class="glass-panel sticky top-0 z-50 border-b border-slate-800/80 py-4 px-6 md:px-12 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white font-black text-xl">⚡</div>
            <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">THUNDER COLT</h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20 font-bold hidden sm:inline-block">متجر نشط ويدعم التسليم الفوري</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-16 flex-grow w-full relative z-10">
        <div class="text-center mb-16 max-w-3xl mx-auto">
            <div class="inline-block mb-4 px-4 py-1.5 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold tracking-wide uppercase">
                منصة الاشتراكات الرقمية الأولى
            </div>
            <h2 class="text-4xl md:text-6xl font-black mb-6 tracking-tight leading-tight">قوة السرعة والأمان في <span class="bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">حساباتك</span></h2>
            <p class="text-slate-400 text-lg leading-relaxed">اختر اشتراكك المفضل، وكن على موعد مع تجربة رقمية استثنائية وبأسعار لا تقبل المنافسة.</p>
        </div>

        <!-- شبكة المنتجات -->
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- سيتم تعبئة المنتجات تلقائياً -->
        </div>
    </main>

    <footer class="glass-panel border-t border-slate-800/80 py-8 text-center text-slate-500 text-sm relative z-10">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>جميع الحقوق محفوظة &copy; 2026 <span class="text-slate-300 font-bold">THUNDER COLT</span></p>
            <p class="text-xs text-slate-600">مصمم خصيصاً لتجربة تسوق رقمية فائقة السرعة</p>
        </div>
    </footer>

    <script>
        // المنتجات المتاحة فوراً لضمان ظهور المتجر بشكل أنيق ومستقر
        const products = [
            {
                name: "اشتراك يوتيوب بريميوم",
                description: "استمتع بمشاهدة بدون إعلانات مع تشغيل في الخلفية وميزة يوتيوب ميوزك لفترة طويلة.",
                price: 10,
                image_url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop"
            },
            {
                name: "اشتراك نتفلكس",
                description: "شاشة خاصة بجودة 4K أصلية مع ضمان كامل ومتابعة بدون وقوف.",
                price: 20,
                image_url: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=800&auto=format&fit=crop"
            }
        ];

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = "glass-panel rounded-3xl overflow-hidden flex flex-col justify-between neon-glow transition-all duration-500 group";
                
                card.innerHTML = `
                    <div>
                        <div class="h-52 overflow-hidden relative">
                            <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
                            <div class="absolute top-4 right-4 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-700/60 text-xs font-black text-blue-400 flex items-center gap-1.5 shadow-lg">
                                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> تسليم فوري
                            </div>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start gap-4 mb-3">
                                <h4 class="text-xl font-black group-hover:text-blue-400 transition-colors leading-snug">${product.name}</h4>
                                <div class="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-xl text-emerald-400 font-black text-lg whitespace-nowrap">
                                    ${product.price} <span class="text-xs font-medium text-emerald-500/80">ر.س</span>
                                </div>
                            </div>
                            <p class="text-slate-400 text-sm mb-6 leading-relaxed line-clamp-2">${product.description}</p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 pt-0">
                        <a href="https://wa.me/966500000000?text=${encodeURIComponent('السلام عليكم، أرغب في شراء منتج: ' + product.name + ' بسعر ' + product.price + ' ر.س')}" target="_blank" 
                           class="w-full bg-gradient-to-r from-blue-600 via-blue-500 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-3.5 px-4 rounded-2xl text-center transition-all duration-300 shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2.5 group-hover:scale-[1.02]">
                            <span class="text-lg">🛒</span> <span>اطلب الآن عبر واتساب</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        renderProducts();
    </script>
</body>
</html>

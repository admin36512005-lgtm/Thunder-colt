<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THUNDER COLT | المتجر الرقمي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- الهيدر -->
    <header class="glass-card sticky top-0 z-50 border-b border-slate-800 py-4 px-6 md:px-12 flex justify-between items-center">
        <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">THUNDER COLT</h1>
        <span class="text-xs bg-blue-500/10 text-blue-400 px-3 py-1.5 rounded-full border border-blue-500/20 font-bold">متجر رقمي معتمد ⚡</span>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="text-center mb-12">
            <h2 class="text-3xl md:text-5xl font-black mb-4">الاشتراكات الرقمية المميزة</h2>
            <p class="text-slate-400 text-lg">اختر منتجك المفضلة واحصل عليه بتسليم فوري وآمن</p>
        </div>

        <!-- شبكة المنتجات -->
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- سيتم تعبئة المنتجات هنا تلقائياً من Supabase -->
            <div class="text-center col-span-full text-slate-500 py-10">جاري تحميل المنتجات...</div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        جميع الحقوق محفوظة &copy; 2026 THUNDER COLT
    </footer>

    <!-- سكريبت الاتصال بقاعدة البيانات وعرض المنتجات -->
    <script>
        const SUPABASE_URL = 'https://ucexqqdowabodjckufe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HowQ_BII_xJbVKFiwe08bw_13kSVGuj';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchProducts() {
            const container = document.getElementById('products-container');
            
            try {
                const { data, error } = await _supabase.from('products').select('*');
                
                if (error) {
                    throw error;
                }

                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center col-span-full text-slate-400 py-10">لا توجد منتجات مضافة حالياً في قاعدة البيانات.</div>';
                    return;
                }

                data.forEach(product => {
                    const card = document.createElement('div');
                    card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between transition-all duration-300 hover:border-blue-500/50 hover:shadow-xl hover:shadow-blue-500/10 group";
                    
                    const productImage = product.image_url ? product.image_url : 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop';
                    const productDesc = product.description || product.descreption || 'اشتراك رقمي مضمون وخدمة سريعة.';

                    card.innerHTML = `
                        <div>
                            <div class="h-48 overflow-hidden relative">
                                <img src="${productImage}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-lg border border-slate-700 text-xs font-bold text-blue-400">
                                    متوفر فوري
                                </div>
                            </div>
                            <div class="p-6">
                                <div class="flex justify-between items-center mb-3">
                                    <h4 class="text-xl font-bold group-hover:text-blue-400 transition-colors">${product.name}</h4>
                                    <span class="text-xl font-black text-emerald-400">${product.price} <span class="text-xs text-slate-400">ر.س</span></span>
                                </div>
                                <p class="text-slate-400 text-sm mb-6 leading-relaxed">${productDesc}</p>
                            </div>
                        </div>
                        <div class="px-6 pb-6 pt-0">
                            <a href="https://wa.me/966500000000?text=${encodeURIComponent('أرغب في شراء منتج: ' + product.name + ' بسعر ' + product.price + ' ر.س')}" target="_blank" 
                               class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl text-center transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                                <span>🛒</span> اطلب الآن عبر واتساب
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error('خطأ في جلب البيانات:', err);
                container.innerHTML = `<div class="text-center col-span-full text-red-400 py-10">حدث خطأ أثناء جلب المنتجات: ${err.message}</div>`;
            }
        }

        fetchProducts();
    </script>
</body>
</html>
